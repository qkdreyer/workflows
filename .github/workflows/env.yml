on:
  pull_request: ~

env:
  IS_PR: ${{ github.event_name == 'pull_request' }}

jobs:
  foo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/foo
      - run: echo is_pr
        if: ${{ env.IS_PR }}
      - run: echo is_not_pr
        if: ${{ !env.IS_PR }}
