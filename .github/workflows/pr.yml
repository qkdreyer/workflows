on:
  pull_request: ~
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Dump GitHub context
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
  true:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        id: update
        with:
          script: return true
      - run: echo ${{ steps.update.outputs.result == 'true' && '--update-snapshots' || '' }}
  false:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        id: update
        with:
          script: return false
      - run: echo ${{ steps.update.outputs.result == 'true' && '--update-snapshots' || '' }}
